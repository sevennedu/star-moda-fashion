<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
  <title>Fachada da Star Moda Fashion</title>
  <defs>
    <linearGradient id="vidro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f78bf"/>
      <stop offset="0.38" stop-color="#8fb8e0"/>
      <stop offset="0.55" stop-color="#c9d6e2"/>
      <stop offset="1" stop-color="#7d8794"/>
    </linearGradient>
    <linearGradient id="reflexo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="placa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232a40"/>
      <stop offset="1" stop-color="#171c2c"/>
    </linearGradient>
    <linearGradient id="interior" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14171d"/>
      <stop offset="1" stop-color="#262a31"/>
    </linearGradient>
    <pattern id="tijolo" width="60" height="24" patternUnits="userSpaceOnUse">
      <rect width="60" height="24" fill="#b5653f"/>
      <path d="M0 0H60M0 12H60M15 0V12M45 12V24" stroke="#94502f" stroke-width="2"/>
    </pattern>
    <symbol id="estrela" viewBox="-1 -1 2 2">
      <path d="M0,-1 L0.235,-0.324 L0.951,-0.309 L0.38,0.124 L0.588,0.809 L0,0.4 L-0.588,0.809 L-0.38,0.124 L-0.951,-0.309 L-0.235,-0.324 Z" fill="#F5C400"/>
    </symbol>
  </defs>

  <!-- Prédio acima da placa -->
  <rect width="900" height="120" fill="#d7dbe0"/>
  <g fill="#a9c6e2" stroke="#f4f6f8" stroke-width="8">
    <rect x="160" y="-10" width="210" height="120"/>
    <rect x="370" y="-10" width="210" height="120"/>
    <rect x="580" y="-10" width="210" height="120"/>
    <rect x="790" y="-10" width="140" height="120"/>
  </g>

  <!-- Placa -->
  <rect x="0" y="110" width="900" height="330" fill="url(#placa)"/>
  <rect x="0" y="430" width="900" height="16" fill="#0f1220"/>
  <use href="#estrela" x="383" y="134" width="26" height="26"/>
  <use href="#estrela" x="505" y="146" width="24" height="24"/>
  <use href="#estrela" x="602" y="120" width="48" height="48"/>
  <use href="#estrela" x="705" y="144" width="28" height="28"/>
  <use href="#estrela" x="770" y="156" width="20" height="20"/>
  <text x="60" y="352" font-family="Arial Black, Archivo Black, Arial, sans-serif" font-weight="900" font-size="230" fill="#ffffff" textLength="790" lengthAdjust="spacingAndGlyphs">STAR</text>
  <text x="140" y="414" font-family="Arial Black, Archivo Black, Arial, sans-serif" font-weight="900" font-size="66" fill="#F5C400" textLength="700" lengthAdjust="spacingAndGlyphs">Moda Fashion</text>

  <!-- Parede da loja -->
  <rect x="0" y="446" width="900" height="664" fill="#16181d"/>

  <!-- Entrada aberta à esquerda -->
  <rect x="0" y="470" width="150" height="640" fill="url(#interior)"/>
  <rect x="0" y="470" width="150" height="26" fill="#e9e6df"/>
  <rect x="20" y="520" width="34" height="8" rx="2" fill="#ffe08a"/>
  <rect x="96" y="560" width="30" height="7" rx="2" fill="#ffe08a"/>
  <g>
    <rect x="18" y="800" width="120" height="6" fill="#9aa3ad"/>
    <rect x="22" y="806" width="18" height="90" fill="#7a2730"/>
    <rect x="42" y="806" width="16" height="96" fill="#2f3f66"/>
    <rect x="60" y="806" width="18" height="88" fill="#d9cbb4"/>
    <rect x="80" y="806" width="16" height="94" fill="#3b3b3b"/>
    <rect x="98" y="806" width="18" height="90" fill="#c64a3c"/>
    <rect x="70" y="930" width="44" height="80" rx="6" fill="#d23b3b"/>
  </g>
  <rect x="0" y="1010" width="150" height="100" fill="#3a3e46"/>

  <!-- Portas de vidro -->
  <rect x="170" y="470" width="700" height="640" fill="url(#vidro)"/>

  <!-- Reflexo de árvore e poste -->
  <path d="M640 480 C 610 520, 640 560, 700 560 C 760 600, 840 560, 860 520 L 860 480 Z" fill="#2d3b2c" opacity="0.45"/>
  <rect x="655" y="560" width="5" height="160" fill="#2d3135" opacity="0.7"/>
  <rect x="610" y="600" width="90" height="3" fill="#2d3135" opacity="0.5"/>

  <!-- Manequins (atrás do vidro) -->
  <g opacity="0.92">
    <!-- 1: casaco caramelo -->
    <circle cx="245" cy="662" r="16" fill="#eef0f2"/>
    <rect x="240" y="676" width="10" height="14" fill="#eef0f2"/>
    <path d="M212 690 H278 L286 820 H204 Z" fill="#a8774a"/>
    <path d="M222 820 H268 L262 1010 H228 Z" fill="#e7e2d8"/>
    <!-- 2: blusa branca e saia preta -->
    <circle cx="350" cy="652" r="16" fill="#eef0f2"/>
    <rect x="345" y="666" width="10" height="14" fill="#eef0f2"/>
    <path d="M318 680 H382 L388 770 H312 Z" fill="#f4f4f2"/>
    <path d="M312 770 H388 L396 860 H304 Z" fill="#1f2024"/>
    <rect x="336" y="860" width="10" height="150" fill="#eef0f2"/>
    <rect x="356" y="860" width="10" height="150" fill="#eef0f2"/>
    <!-- 3: vestido marrom -->
    <circle cx="452" cy="660" r="16" fill="#eef0f2"/>
    <path d="M420 690 H484 L500 960 H404 Z" fill="#8a5a36"/>
    <!-- 4: camisa listrada e saia branca -->
    <circle cx="570" cy="642" r="17" fill="#eef0f2"/>
    <rect x="565" y="657" width="10" height="14" fill="#eef0f2"/>
    <g>
      <path d="M534 671 H606 L612 790 H528 Z" fill="#f6f6f6"/>
      <path d="M538 690 H602 M536 712 H604 M534 734 H606 M532 756 H608 M530 778 H610" stroke="#1d1e22" stroke-width="7"/>
    </g>
    <path d="M532 790 H608 L604 1010 H536 Z" fill="#f1efe9"/>
    <!-- 5: casaco marrom e calça -->
    <circle cx="690" cy="664" r="16" fill="#eef0f2"/>
    <path d="M656 692 H724 L732 840 H648 Z" fill="#6b4a33"/>
    <path d="M664 840 H716 L712 1010 H668 Z" fill="#e6e0d4"/>
    <!-- 6: listrada (fundo) -->
    <circle cx="800" cy="668" r="15" fill="#eef0f2"/>
    <g>
      <path d="M770 694 H830 L836 800 H764 Z" fill="#f2f2f2"/>
      <path d="M770 714 H830 M768 736 H832 M766 758 H834 M764 780 H836" stroke="#1d1e22" stroke-width="6"/>
    </g>
    <path d="M766 800 H834 L828 1000 H772 Z" fill="#d9d2c4"/>
  </g>

  <!-- Reflexo diagonal no vidro -->
  <rect x="170" y="470" width="700" height="640" fill="url(#reflexo)"/>

  <!-- Caixilhos brancos -->
  <g fill="none" stroke="#f3f5f7">
    <rect x="170" y="470" width="700" height="640" stroke-width="16"/>
    <line x1="403" y1="470" x2="403" y2="1110" stroke-width="12"/>
    <line x1="637" y1="470" x2="637" y2="1110" stroke-width="12"/>
    <line x1="170" y1="520" x2="870" y2="520" stroke-width="8"/>
  </g>
  <rect x="160" y="1090" width="720" height="20" fill="#e3e6ea"/>

  <!-- Câmera / luminária na parede -->
  <rect x="878" y="760" width="16" height="22" rx="4" fill="#5c6068"/>

  <!-- Calçada -->
  <rect x="0" y="1110" width="900" height="90" fill="url(#tijolo)"/>
  <rect x="0" y="1110" width="900" height="6" fill="#7d4329" opacity="0.6"/>
</svg>
