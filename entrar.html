<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minha conta | Star Moda Fashion</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="app-page">
<header class="app-top">
  <div class="container">
    <a href="/"><img src="assets/favicon.svg" alt="" width="52" height="52">Voltar ao site</a>
  </div>
</header>

<main class="app-main" id="conteudo">
  <div class="container">
    <div class="section-head">
      <p class="eyebrow">Star Moda Fashion</p>
      <p class="script">Vestindo Estrelas</p>
      <h2>Minha conta</h2>
    </div>

    <!-- Conectada -->
    <section class="card card--narrow form" id="logada" hidden>
      <p>Olá, <strong id="eu-nome"></strong>!</p>
      <p class="note" id="eu-email"></p>
      <a class="btn btn--dark btn--block" href="/admin.html" id="ir-painel" hidden>Abrir o painel</a>
      <a class="btn btn--outline btn--block" href="/#vitrine">Ver os vestidos</a>
      <button class="btn btn--outline btn--block" type="button" id="sair">Sair</button>
      <button class="btn btn--block btn--danger" type="button" id="excluir">Excluir minha conta</button>
      <p class="msg msg--erro" id="msg-conta" role="alert" hidden></p>
    </section>

    <!-- Desconectada -->
    <section class="card card--narrow form" id="deslogada" hidden>
      <div class="tabs" role="tablist">
        <button class="tab" type="button" role="tab" aria-selected="true" data-aba="entrar">Entrar</button>
        <button class="tab" type="button" role="tab" aria-selected="false" data-aba="cadastro">Criar conta</button>
      </div>

      <form class="form" id="form-entrar" data-painel="entrar" novalidate>
        <label>E-mail<input type="email" name="email" autocomplete="email" required></label>
        <label>Senha<input type="password" name="senha" autocomplete="current-password" required></label>
        <button class="btn btn--red btn--block" type="submit">Entrar</button>
      </form>

      <form class="form" id="form-cadastro" data-painel="cadastro" novalidate hidden>
        <label>Nome<input type="text" name="nome" autocomplete="name" required maxlength="80"></label>
        <label>E-mail<input type="email" name="email" autocomplete="email" required maxlength="120"></label>
        <label>WhatsApp com DDD<input type="tel" name="telefone" autocomplete="tel" placeholder="(18) 90000-0000" required></label>
        <label>Senha (mínimo 8 caracteres)<input type="password" name="senha" autocomplete="new-password" required minlength="8"></label>
        <label class="check"><input type="checkbox" name="consentimento" required><span>Autorizo a Star Moda Fashion a guardar meu nome, e-mail e WhatsApp para atendimento. Posso excluir minha conta a qualquer momento nesta página.</span></label>
        <button class="btn btn--red btn--block" type="submit">Criar conta</button>
      </form>

      <p class="msg msg--erro" id="msg" role="alert" hidden></p>
    </section>
  </div>
</main>

<script src="js/conta.js" defer></script>
</body>
</html>
